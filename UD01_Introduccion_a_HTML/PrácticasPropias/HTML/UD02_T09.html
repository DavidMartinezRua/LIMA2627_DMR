<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="autor" content="DMR"/>
    <title>Formulario de rexistro</title>
</head>
<body>
    <form action="" method="GET">

        <li>
            <label for="nome">Nombre:</label>
            <input type="text" id="nome"name="user_name" placeholder="e.g. Jeffrey" maxlength="15">
        </li>
        <br>
        <li>
            <label for="apellido">Apellidos:</label>
            <input type="text" id="apellido"name="user_surname" placeholder="e.g. Epstein" pattern="{1,50}"/>
        </li>
        <br>
        Email:<input type="email" id="email" name="email"/>
        <br>
        <li>
            <br>
            Sexo:<select>
                <option>Hombre</option>
                <option>Mujer</option>
            </select>
        </li> 
        <br>
        <li>
            Desexo recibir información sobre novidades  e ofertas:<input type="checkbox" id="info" name="info" />
        </li>
        <br>
        <li>
            Declaro aceptar as condicións xerais do programa e a normativa sobre protección de datos:<input type="checkbox" id="permiso" name="permiso" checked="checked" />
        </li>
        <br>
        <li>
            Localidade:<select>
                <option>A Coruña</option>
                <option>Lugo</option>
                <option>Ourense</option>
                <option>Pontevedra</option>
            </select>
        </li>
        <br>
        <input type="submit" value="Enviar">

    
    </form>
</body>
</html>
