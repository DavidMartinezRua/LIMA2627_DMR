<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="”UTF-8”"/>
        <meta name="descripcion" content="Primer ejemplo de tablas"/>
        <meta name="author" content="DMR"/>
        <meta title="Segunda Tabla"/>
    </head>
    <body>
        <table border="">
            <thead></thead>
            <tbody>
                <tr>
                    <!-- fila 1-->
                    <td colspan="2">Fila 1, Columna 1</td>
                    <td colspan="2" rowspan="2">Fila 1, Columna 2</td>
                    <td colspan="2">Fila 1, Columna 3</td>
                </tr>
                <tr>
                    <!-- fila 2-->
                    <td colspan="2">Fila 2, Columna 1</td>
                    <td colspan="2">Fila 2, Columna 2</td>
                </tr>
                <tr>
                    <!-- fila 3-->
                    <td colspan="3">Fila 3, Columna 1</td>
                    <td colspan="1" rowspan="2">Fila 3, Columna 2</td>
                    <td colspan="2">Fila 3, Columna 3</td>
                </tr>
                <tr>
                    <!-- fila 4-->
                    <td colspan="3">Fila 4, Columna 1</td>
                    <td colspan="2">Fila 4, Columna 2</td>
                </tr>
                <tr>
                    <!-- fila 5-->
                    <td colspan="3">Fila 5, Columna 1</td>
                    <td colspan="3">Fila 5, Columna 2</td>
                </tr>
                <tr>
                    <!-- fila 6-->
                    <td colspan="2">Fila 6, Columna 1</td>
                    <td>Fila 6, Columna 2</td>
                    <td colspan="3">Fila 6, Columna 2</td>
                </tr>
            </tbody>
            <tfoot></tfoot>
        </table>
    </body>
</html>
